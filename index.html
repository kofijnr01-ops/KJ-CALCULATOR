<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060b1d">
<title>KJ Calculator v1.7</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#060b1d;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  padding:12px 24px;
  display:flex;
  flex-direction:column;
}

/* TOP */

.top{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu{
  width:56px;
  height:56px;
  border-radius:19px;
  background:#101a38;
  border:1px solid #233968;
  color:white;
  font-size:31px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:2px;
}

.version{
  color:#7180a9;
  font-size:16px;
}

/* DISPLAY */

.display{
  flex:1;
  min-height:0;
  margin:10px 0 15px;
  padding:22px 24px;
  border-radius:34px;
  background:#0d1530;
  border:1px solid #243968;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.expression{
  width:100%;
  min-height:27px;
  text-align:right;
  color:#7180a9;
  font-size:19px;
  white-space:nowrap;
  overflow:hidden;
}

.result{
  width:100%;
  text-align:right;
  font-size:62px;
  font-weight:300;
  white-space:nowrap;
  overflow:hidden;
}

/* KEYBOARD */

.buttons{
  height:390px;
  min-height:390px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  border:none;
  outline:none;
  color:white;
  background:#101a38;
  border-radius:23px;
  font-size:27px;
  font-weight:700;
  touch-action:manipulation;
  transition:transform .08s,filter .08s;
}

button:active{
  transform:scale(.93);
  filter:brightness(1.25);
}

.operator{
  background:#172650;
}

.clear{
  background:#652443;
}

.equals{
  background:#315df5;
}

.plusminus{
  background:#172650;
}

/* HISTORY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  z-index:100;
}

.overlay.show{
  display:block;
}

.history{
  width:min(88%,390px);
  height:100%;
  background:#091127;
  border-right:1px solid #243968;
  padding:22px;
  overflow-y:auto;
}

.history-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.history-title{
  font-size:28px;
  font-weight:800;
}

.close{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#172342;
  font-size:28px;
}

.clear-history{
  width:100%;
  height:55px;
  margin-bottom:18px;
  border-radius:18px;
  background:#652443;
  font-size:18px;
}

.history-item{
  padding:17px;
  margin-bottom:12px;
  border-radius:20px;
  background:#101a38;
  border:1px solid #1e3158;
}

.history-expression{
  color:#7180a9;
  font-size:16px;
  margin-bottom:7px;
}

.history-result{
  font-size:25px;
  font-weight:700;
}

/* SMALL PHONES */

@media(max-height:700px){

  .app{
    padding:7px 18px;
  }

  .top{
    height:54px;
    min-height:54px;
  }

  .menu{
    width:50px;
    height:50px;
    border-radius:17px;
    font-size:28px;
  }

  .logo{
    font-size:31px;
  }

  .version{
    font-size:14px;
  }

  .display{
    margin:7px 0 9px;
    padding:15px 18px;
    border-radius:28px;
  }

  .result{
    font-size:50px;
  }

  .expression{
    font-size:16px;
  }

  .buttons{
    height:330px;
    min-height:330px;
    gap:9px;
  }

  button{
    border-radius:20px;
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button class="menu" onclick="openHistory()">☰</button>

    <div class="logo">KJ</div>

    <div class="version">v1.7</div>

  </div>

  <div class="display">

    <div class="expression" id="expression"></div>

    <div class="result" id="result">0</div>

  </div>

  <div class="buttons">

    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="setOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="setOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="setOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="setOperator('+')">+</button>

    <button class="plusminus" onclick="plusMinus()">±</button>
    <button onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>

</div>

<!-- HISTORY -->

<div class="overlay" id="overlay">

  <div class="history">

    <div class="history-top">

      <div class="history-title">History</div>

      <button class="close" onclick="closeHistory()">×</button>

    </div>

    <button class="clear-history" onclick="clearHistory()">
      Clear History
    </button>

    <div id="historyList"></div>

  </div>

</div>

<script>

/* =========================
   KJ CALCULATOR v1.7
========================= */

let current = "0";
let expressionParts = [];
let operator = null;
let waiting = false;
let justCalculated = false;

let history =
JSON.parse(localStorage.getItem("kj_history") || "[]");

const result =
document.getElementById("result");

const expression =
document.getElementById("expression");


/* =========================
   FEEDBACK
========================= */

function feedback(){

  if(navigator.vibrate){
    navigator.vibrate(8);
  }

}


/* =========================
   UPDATE DISPLAY
========================= */

function update(){

  result.textContent = current;

}


/* =========================
   NUMBER
========================= */

function number(n){

  feedback();

  if(current === "Error"){
    clearAll();
  }

  if(justCalculated){

    current = n;
    expression.textContent = "";
    expressionParts = [];
    justCalculated = false;
    waiting = false;

    update();
    return;
  }

  if(waiting){

    current = n;
    waiting = false;

  }else{

    if(current === "0"){
      current = n;
    }else{
      current += n;
    }

  }

  update();

}


/* =========================
   DECIMAL
========================= */

function decimal(){

  feedback();

  if(justCalculated){

    current = "0.";
    expression.textContent = "";
    expressionParts = [];
    justCalculated = false;
    waiting = false;

    update();
    return;
  }

  if(waiting){

    current = "0.";
    waiting = false;

  }else if(!current.includes(".")){

    current += ".";

  }

  update();

}


/* =========================
   PLUS / MINUS
========================= */

function plusMinus(){

  feedback();

  if(current === "0" || current === "Error"){
    return;
  }

  if(current.startsWith("-")){

    current =
      current.substring(1);

  }else{

    current =
      "-" + current;

  }

  update();

}


/* =========================
   OPERATOR
========================= */

function setOperator(op){

  feedback();

  if(current === "Error"){
    return;
  }

  if(justCalculated){

    expressionParts = [
      parseFloat(current)
    ];

    justCalculated = false;

  }

  if(operator !== null && !waiting){

    calculate(false);

  }

  const value =
    parseFloat(current);

  expressionParts = [
    value
  ];

  operator = op;
  waiting = true;

  expression.textContent =
    value + " " +
    showOperator(op);

}


/* =========================
   CALCULATE
========================= */

function calculate(save=true){

  feedback();

  if(operator === null ||
     expressionParts.length === 0){

    return;
  }

  const firstNumber =
    parseFloat(expressionParts[0]);

  const secondNumber =
    parseFloat(current);

  let answer;


  if(operator === "+"){
    answer =
      firstNumber + secondNumber;
  }

  if(operator === "-"){
    answer =
      firstNumber - secondNumber;
  }

  if(operator === "*"){
    answer =
      firstNumber * secondNumber;
  }

  if(operator === "/"){

    if(secondNumber === 0){

      current = "Error";

      operator = null;
      expressionParts = [];
      waiting = true;
      justCalculated = true;

      update();
      return;
    }

    answer =
      firstNumber / secondNumber;

  }


  answer =
    format(answer);


  const fullExpression =
    firstNumber + " " +
    showOperator(operator) + " " +
    secondNumber;


  current = answer;

  expression.textContent =
    fullExpression;


  if(save){

    addHistory(
      fullExpression,
      answer
    );

  }


  operator = null;
  expressionParts = [];

  waiting = true;
  justCalculated = true;

  update();

}


/* =========================
   FORMAT
========================= */

function format(num){

  if(!Number.isFinite(num)){
    return "Error";
  }

  return String(
    parseFloat(
      num.toFixed(10)
    )
  );

}


/* =========================
   OPERATOR SYMBOL
========================= */

function showOperator(op){

  if(op === "*") return "×";

  if(op === "/") return "÷";

  if(op === "-") return "−";

  return op;

}


/* =========================
   PERCENT
========================= */

function percent(){

  feedback();

  const value =
    parseFloat(current);

  if(isNaN(value)){
    return;
  }

  current =
    format(value / 100);

  update();

}


/* =========================
   BACKSPACE
========================= */

function backspace(){

  feedback();

  if(justCalculated){

    current = "0";
    expression.textContent = "";
    justCalculated = false;

    update();
    return;
  }

  if(waiting){
    return;
  }

  if(current === "Error"){

    clearAll();
    return;

  }

  if(current.length <= 1){

    current = "0";

  }else{

    current =
      current.slice(0,-1);

  }

  update();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  feedback();

  current = "0";
  expressionParts = [];
  operator = null;
  waiting = false;
  justCalculated = false;

  expression.textContent = "";

  update();

}


/* =========================
   HISTORY
========================= */

function addHistory(exp,res){

  history.unshift({

    expression:exp,
    result:res

  });

  if(history.length > 50){

    history.pop();

  }

  localStorage.setItem(
    "kj_history",
    JSON.stringify(history)
  );

}


function openHistory(){

  feedback();

  renderHistory();

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeHistory(){

  document
    .getElementById("overlay")
    .classList.remove("show");

}


function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";


  if(history.length === 0){

    list.innerHTML =
      '<div style="text-align:center;color:#7180a9;padding:30px 0;">No calculations yet</div>';

    return;

  }


  history.forEach((item)=>{

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.innerHTML =

      '<div class="history-expression">' +
      item.expression +
      '</div>' +

      '<div class="history-result">= ' +
      item.result +
      '</div>';


    div.onclick = function(){

      current =
        item.result;

      expressionParts = [];
      operator = null;
      waiting = true;
      justCalculated = true;

      expression.textContent =
        item.expression;

      update();

      closeHistory();

    };


    list.appendChild(div);

  });

}


function clearHistory(){

  feedback();

  history = [];

  localStorage.removeItem(
    "kj_history"
  );

  renderHistory();

}


/* =========================
   CLOSE HISTORY OUTSIDE
========================= */

document
.getElementById("overlay")
.addEventListener(
  "click",
  function(e){

    if(e.target === this){

      closeHistory();

    }

  }
);


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key >= "0" && e.key <= "9"){

      number(e.key);

    }

    else if(e.key === "."){

      decimal();

    }

    else if(e.key === "+"){

      setOperator("+");

    }

    else if(e.key === "-"){

      setOperator("-");

    }

    else if(e.key === "*"){

      setOperator("*");

    }

    else if(e.key === "/"){

      e.preventDefault();
      setOperator("/");

    }

    else if(e.key === "%"){

      percent();

    }

    else if(e.key === "Enter" || e.key === "="){

      calculate();

    }

    else if(e.key === "Backspace"){

      backspace();

    }

    else if(e.key === "Escape"){

      clearAll();

    }

  }
);


/* START */

update();

</script>

</body>
  </html>
