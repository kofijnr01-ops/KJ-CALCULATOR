<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060b1d">
<title>KJ Calculator v1.9</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#060b1d;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  padding:12px 24px;
  display:flex;
  flex-direction:column;
}

/* TOP */

.top{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu{
  width:56px;
  height:56px;
  border-radius:19px;
  background:#101a38;
  border:1px solid #233968;
  color:white;
  font-size:31px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:2px;
}

.version{
  color:#7180a9;
  font-size:16px;
}

/* DISPLAY */

.display{
  flex:1;
  min-height:0;
  margin:10px 0 15px;
  padding:22px 24px;
  border-radius:34px;
  background:#0d1530;
  border:1px solid #243968;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.expression{
  width:100%;
  min-height:27px;
  text-align:right;
  color:#7180a9;
  font-size:19px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result{
  width:100%;
  text-align:right;
  font-size:62px;
  font-weight:300;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:font-size .12s ease;
  cursor:pointer;
}

.copy-hint{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#172650;
  border:1px solid #31528f;
  padding:12px 18px;
  border-radius:15px;
  font-size:15px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:500;
}

.copy-hint.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* BUTTONS */

.buttons{
  height:390px;
  min-height:390px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  border:none;
  outline:none;
  color:white;
  background:#101a38;
  border-radius:23px;
  font-size:27px;
  font-weight:700;
  touch-action:manipulation;
  transition:transform .08s,filter .08s;
}

button:active{
  transform:scale(.93);
  filter:brightness(1.25);
}

.operator{
  background:#172650;
}

.clear{
  background:#652443;
}

.equals{
  background:#315df5;
}

.plusminus{
  background:#172650;
}

/* HISTORY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  z-index:100;
}

.overlay.show{
  display:block;
}

.history{
  width:min(88%,390px);
  height:100%;
  background:#091127;
  border-right:1px solid #243968;
  padding:22px;
  overflow-y:auto;
}

.history-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.history-title{
  font-size:28px;
  font-weight:800;
}

.close{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#172342;
  font-size:28px;
}

.clear-history{
  width:100%;
  height:55px;
  margin-bottom:18px;
  border-radius:18px;
  background:#652443;
  font-size:18px;
}

.history-item{
  padding:17px;
  margin-bottom:12px;
  border-radius:20px;
  background:#101a38;
  border:1px solid #1e3158;
}

.history-expression{
  color:#7180a9;
  font-size:16px;
  margin-bottom:7px;
}

.history-result{
  font-size:25px;
  font-weight:700;
}

/* SMALL PHONES */

@media(max-height:700px){

  .app{
    padding:7px 18px;
  }

  .top{
    height:54px;
    min-height:54px;
  }

  .menu{
    width:50px;
    height:50px;
    border-radius:17px;
    font-size:28px;
  }

  .logo{
    font-size:31px;
  }

  .version{
    font-size:14px;
  }

  .display{
    margin:7px 0 9px;
    padding:15px 18px;
    border-radius:28px;
  }

  .result{
    font-size:50px;
  }

  .expression{
    font-size:16px;
  }

  .buttons{
    height:330px;
    min-height:330px;
    gap:9px;
  }

  button{
    border-radius:20px;
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button class="menu" onclick="openHistory()">☰</button>

    <div class="logo">KJ</div>

    <div class="version">v1.9</div>

  </div>

  <div class="display">

    <div class="expression" id="expression"></div>

    <div class="result" id="result" onclick="copyResult()">0</div>

  </div>

  <div class="buttons">

    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="setOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="setOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="setOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="setOperator('+')">+</button>

    <button class="plusminus" onclick="plusMinus()">±</button>
    <button onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>

</div>

<div class="overlay" id="overlay">

  <div class="history">

    <div class="history-top">

      <div class="history-title">History</div>

      <button class="close" onclick="closeHistory()">×</button>

    </div>

    <button class="clear-history" onclick="clearHistory()">
      Clear History
    </button>

    <div id="historyList"></div>

  </div>

</div>

<div class="copy-hint" id="copyHint">
  Result copied
</div>

<script>

/* =========================
   KJ CALCULATOR v1.9
========================= */

let current = "0";
let expressionInput = "";
let justCalculated = false;

let history =
JSON.parse(localStorage.getItem("kj_history") || "[]");

const result =
document.getElementById("result");

const expression =
document.getElementById("expression");


/* =========================
   VIBRATION
========================= */

function feedback(){

  if(navigator.vibrate){
    navigator.vibrate(8);
  }

}


/* =========================
   UPDATE
========================= */

function update(){

  result.textContent = current;

  autoSizeResult();

}


/* =========================
   AUTO SIZE RESULT
========================= */

function autoSizeResult(){

  let size = 62;

  if(window.innerHeight <= 700){
    size = 50;
  }

  if(current.length > 12){
    size -= 8;
  }

  if(current.length > 16){
    size -= 8;
  }

  if(current.length > 20){
    size -= 6;
  }

  if(size < 28){
    size = 28;
  }

  result.style.fontSize = size + "px";

}


/* =========================
   NUMBER
========================= */

function number(n){

  feedback();

  if(current === "Error"){
    clearAll();
  }

  if(justCalculated){

    current = n;
    expressionInput = "";
    expression.textContent = "";
    justCalculated = false;

    update();
    return;

  }

  if(current === "0"){

    current = n;

  }else{

    current += n;

  }

  update();

}


/* =========================
   DECIMAL
========================= */

function decimal(){

  feedback();

  if(justCalculated){

    current = "0.";
    expressionInput = "";
    expression.textContent = "";
    justCalculated = false;

    update();
    return;

  }

  if(!current.includes(".")){

    current += ".";

  }

  update();

}


/* =========================
   OPERATOR
========================= */

function setOperator(op){

  feedback();

  if(current === "Error"){
    return;
  }

  if(justCalculated){

    expressionInput = current;
    justCalculated = false;

  }

  if(
    expressionInput === "" ||
    /[+\-*/]$/.test(expressionInput)
  ){

    expressionInput += current;

  }

  if(/[+\-*/]$/.test(expressionInput)){

    expressionInput =
      expressionInput.slice(0,-1);

  }

  expressionInput += op;

  current = "0";

  expression.textContent =
    displayExpression(expressionInput);

  update();

}


/* =========================
   DISPLAY EXPRESSION
========================= */

function displayExpression(exp){

  return exp
    .replace(/\*/g,"×")
    .replace(/\//g,"÷")
    .replace(/-/g,"−");

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  feedback();

  if(current === "Error"){
    return;
  }

  let exp = expressionInput;

  if(exp === "" || /[+\-*/]$/.test(exp)){

    exp += current;

  }

  if(!exp){
    return;
  }

  try{

    const answer =
      evaluateExpression(exp);

    if(!Number.isFinite(answer)){
      throw new Error();
    }

    const formatted =
      format(answer);

    const shownExpression =
      displayExpression(exp);

    current =
      formatted;

    expression.textContent =
      shownExpression;

    addHistory(
      shownExpression,
      formatted
    );

    expressionInput = "";

    justCalculated = true;

    update();

  }catch(e){

    current = "Error";
    expressionInput = "";
    justCalculated = true;

    update();

  }

}


/* =========================
   CALCULATOR ENGINE
========================= */

function evaluateExpression(exp){

  const tokens =
    exp.match(
      /(?:\d+(?:\.\d*)?|\.\d+|[+\-*/])/g
    );

  if(!tokens || tokens.length === 0){
    throw new Error();
  }

  let values = [];
  let operators = [];
  let i = 0;

  function getNumber(){

    let sign = 1;

    if(tokens[i] === "-"){

      sign = -1;
      i++;

    }

    const value =
      parseFloat(tokens[i]);

    if(!Number.isFinite(value)){
      throw new Error();
    }

    i++;

    return sign * value;

  }

  values.push(getNumber());

  while(i < tokens.length){

    const op =
      tokens[i++];

    if(op !== "+" &&
       op !== "-" &&
       op !== "*" &&
       op !== "/"){

      throw new Error();

    }

    const next =
      getNumber();

    if(op === "*"){

      values[values.length - 1] *= next;

    }else if(op === "/"){

      if(next === 0){
        throw new Error();
      }

      values[values.length - 1] /= next;

    }else{

      operators.push(op);
      values.push(next);

    }

  }

  let answer =
    values[0];

  for(
    let j = 0;
    j < operators.length;
    j++
  ){

    if(operators[j] === "+"){

      answer += values[j + 1];

    }else{

      answer -= values[j + 1];

    }

  }

  return answer;

}


/* =========================
   FORMAT
========================= */

function format(num){

  return String(
    parseFloat(
      num.toFixed(10)
    )
  );

}


/* =========================
   PERCENT
========================= */

function percent(){

  feedback();

  const value =
    parseFloat(current);

  if(!Number.isFinite(value)){
    return;
  }

  current =
    format(value / 100);

  update();

}


/* =========================
   PLUS / MINUS
========================= */

function plusMinus(){

  feedback();

  if(
    current === "Error" ||
    current === "0"
  ){
    return;
  }

  if(current.startsWith("-")){

    current =
      current.substring(1);

  }else{

    current =
      "-" + current;

  }

  update();

}


/* =========================
   BACKSPACE
========================= */

function backspace(){

  feedback();

  if(justCalculated){

    current = "0";
    expressionInput = "";
    expression.textContent = "";
    justCalculated = false;

    update();
    return;

  }

  if(current === "Error"){

    clearAll();
    return;

  }

  if(current.length <= 1){

    current = "0";

  }else{

    current =
      current.slice(0,-1);

  }

  update();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  feedback();

  current = "0";
  expressionInput = "";
  justCalculated = false;

  expression.textContent = "";

  update();

}


/* =========================
   COPY RESULT
========================= */

async function copyResult(){

  if(
    current === "0" ||
    current === "Error"
  ){
    return;
  }

  try{

    await navigator.clipboard.writeText(current);

  }catch(e){

    const temp =
      document.createElement("textarea");

    temp.value = current;

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

  }

  feedback();

  const hint =
    document.getElementById("copyHint");

  hint.classList.add("show");

  setTimeout(function(){

    hint.classList.remove("show");

  },1200);

}


/* =========================
   HISTORY
========================= */

function addHistory(exp,res){

  history.unshift({

    expression:exp,
    result:res

  });

  if(history.length > 50){

    history.pop();

  }

  localStorage.setItem(
    "kj_history",
    JSON.stringify(history)
  );

}


function openHistory(){

  feedback();

  renderHistory();

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeHistory(){

  document
    .getElementById("overlay")
    .classList.remove("show");

}


function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  if(history.length === 0){

    list.innerHTML =
      '<div style="text-align:center;color:#7180a9;padding:30px 0;">No calculations yet</div>';

    return;

  }

  history.forEach(function(item){

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.innerHTML =
      '<div class="history-expression">' +
      item.expression +
      '</div>' +

      '<div class="history-result">= ' +
      item.result +
      '</div>';

    div.onclick = function(){

      current =
        item.result;

      expressionInput = "";

      justCalculated = true;

      expression.textContent =
        item.expression;

      update();

      closeHistory();

    };

    list.appendChild(div);

  });

}


function clearHistory(){

  feedback();

  history = [];

  localStorage.removeItem(
    "kj_history"
  );

  renderHistory();

}


/* =========================
   CLOSE HISTORY OUTSIDE
========================= */

document
.getElementById("overlay")
.addEventListener(
  "click",
  function(e){

    if(e.target === this){

      closeHistory();

    }

  }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key >= "0" && e.key <= "9"){

      number(e.key);

    }

    else if(e.key === "."){

      decimal();

    }

    else if(e.key === "+"){

      setOperator("+");

    }

    else if(e.key === "-"){

      setOperator("-");

    }

    else if(e.key === "*"){

      setOperator("*");

    }

    else if(e.key === "/"){

      e.preventDefault();
      setOperator("/");

    }

    else if(e.key === "%"){

      percent();

    }

    else if(
      e.key === "Enter" ||
      e.key === "="
    ){

      calculate();

    }

    else if(e.key === "Backspace"){

      backspace();

    }

    else if(e.key === "Escape"){

      clearAll();

    }

  }
);


/* =========================
   START
========================= */

update();

</script>

</body>
</html>
