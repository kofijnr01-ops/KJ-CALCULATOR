<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>KJ Calculator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #050a18;
  color: white;
}

body {
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  background: #080d20;
  border-bottom: 1px solid #1d2948;
  flex-shrink: 0;
}

.history-btn {
  background: none;
  border: none;
  color: white;
  font-size: 25px;
  padding: 8px;
  cursor: pointer;
}

.title {
  margin-left: 10px;
  font-size: 20px;
  font-weight: bold;
}

.calculator {
  width: 100%;
  height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  padding: 15px;
}

.display {
  width: 100%;
  min-height: 130px;
  background: #0b1228;
  border: 1px solid #1d2948;
  border-radius: 22px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  overflow: hidden;
}

.expression {
  width: 100%;
  text-align: right;
  color: #8994ad;
  font-size: 18px;
  min-height: 25px;
  overflow-x: auto;
}

.result {
  width: 100%;
  text-align: right;
  font-size: 42px;
  font-weight: bold;
  overflow-x: auto;
  white-space: nowrap;
}

.buttons {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 10px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 18px;
  background: #111a35;
  color: white;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.94);
  background: #1d2948;
}

.operator {
  background: #172448;
}

.equals {
  background: #315cff;
}

.clear {
  background: #44203a;
}

.zero {
  grid-column: span 2;
}

.history-panel {
  position: fixed;
  top: 0;
  left: -100%;
  width: 85%;
  max-width: 360px;
  height: 100%;
  background: #080d20;
  z-index: 100;
  padding: 20px;
  transition: left 0.25s ease;
  border-right: 1px solid #1d2948;
}

.history-panel.open {
  left: 0;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.history-header h2 {
  font-size: 22px;
}

.close-history {
  background: none;
  font-size: 28px;
  padding: 5px;
}

.history-list {
  color: #c8d0e0;
  overflow-y: auto;
  height: calc(100% - 70px);
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #1d2948;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 90;
  display: none;
}

.overlay.show {
  display: block;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="history-btn" onclick="openHistory()">☰</button>
  <div class="title">KJ Calculator</div>
</div>

<div class="calculator">

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">

    <button class="clear" onclick="clearCalc()">AC</button>
    <button onclick="deleteLast()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="operator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="operator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="operator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="operator('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>
</div>

<div class="overlay" id="overlay" onclick="closeHistory()"></div>

<div class="history-panel" id="historyPanel">

  <div class="history-header">
    <h2>History</h2>
    <button class="close-history" onclick="closeHistory()">×</button>
  </div>

  <div class="history-list" id="historyList">
    No calculations yet.
  </div>

</div>

<script>
let current = "0";
let previous = "";
let currentOperator = "";
let history = [];

const result = document.getElementById("result");
const expression = document.getElementById("expression");

function updateDisplay() {
  result.textContent = current;
  expression.textContent =
    previous && currentOperator
      ? previous + " " + currentOperator
      : "";
}

function number(num) {
  if (current === "0") {
    current = num;
  } else {
    current += num;
  }

  updateDisplay();
}

function decimal() {
  if (!current.includes(".")) {
    current += ".";
  }

  updateDisplay();
}

function operator(op) {
  if (current === "") return;

  if (previous !== "" && currentOperator !== "") {
    calculate();
  }

  previous = current;
  currentOperator = op;
  current = "0";

  updateDisplay();
}

function calculate() {
  if (previous === "" || currentOperator === "") return;

  const a = parseFloat(previous);
  const b = parseFloat(current);
  let answer;

  if (currentOperator === "+") {
    answer = a + b;
  } else if (currentOperator === "-") {
    answer = a - b;
  } else if (currentOperator === "*") {
    answer = a * b;
  } else if (currentOperator === "/") {
    if (b === 0) {
      current = "Error";
      previous = "";
      currentOperator = "";
      updateDisplay();
      return;
    }

    answer = a / b;
  }

  answer = Number.isInteger(answer)
    ? answer.toString()
    : parseFloat(answer.toFixed(10)).toString();

  addHistory(previous + " " + currentOperator + " " + current + " = " + answer);

  current = answer;
  previous = "";
  currentOperator = "";

  updateDisplay();
}

function clearCalc() {
  current = "0";
  previous = "";
  currentOperator = "";
  updateDisplay();
}

function deleteLast() {
  if (current.length > 1) {
    current = current.slice(0, -1);
  } else {
    current = "0";
  }

  updateDisplay();
}

function percent() {
  const value = parseFloat(current);

  if (!isNaN(value)) {
    current = (value / 100).toString();
  }

  updateDisplay();
}

function addHistory(item) {
  history.unshift(item);

  const list = document.getElementById("historyList");

  list.innerHTML = history.map(function(item) {
    return '<div class="history-item">' + item + '</div>';
  }).join("");
}

function openHistory() {
  document.getElementById("historyPanel").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeHistory() {
  document.getElementById("historyPanel").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

updateDisplay();
</script>

</body>
</html>
