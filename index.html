<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KJ Calculator v2.0</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050a18;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    height:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    background:#050a18;
    position:relative;
}

/* HEADER */

.header{
    height:62px;
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;
}

.version{
    font-size:11px;
    color:#8e99ad;
    margin-top:3px;
}

/* HISTORY BUTTON */

.history-btn{
    border:0;
    background:#101a31;
    color:white;
    width:42px;
    height:42px;
    border-radius:14px;
    font-size:20px;
    cursor:pointer;
}

.history-btn:active{
    transform:scale(.94);
}

/* DISPLAY */

.display{
    flex:1;
    min-height:170px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-end;
    padding:20px 22px 18px;
    overflow:hidden;
}

.previous{
    width:100%;
    min-height:30px;
    text-align:right;
    color:#7e899d;
    font-size:18px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.current{
    width:100%;
    text-align:right;
    font-size:48px;
    font-weight:700;
    letter-spacing:-1px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* BUTTON AREA */

.buttons{
    width:100%;
    padding:12px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:minmax(62px,1fr);
    gap:10px;
    max-height:470px;
}

button{
    border:0;
    outline:none;
    color:white;
    background:#101a31;
    border-radius:20px;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
    transition:transform .08s,background .08s;
}

button:active{
    transform:scale(.94);
    background:#182541;
}

.number{
    background:#0d162b;
}

.operator{
    background:#182541;
}

.special{
    background:#202c47;
}

.equals{
    background:#ffffff;
    color:#050a18;
}

.zero{
    grid-column:span 2;
}

/* HISTORY PANEL */

.history-panel{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#050a18;
    transform:translateX(-100%);
    transition:transform .22s ease;
    display:flex;
    flex-direction:column;
}

.history-panel.open{
    transform:translateX(0);
}

.history-header{
    height:62px;
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.history-title{
    font-size:20px;
    font-weight:800;
}

.close-history{
    width:42px;
    height:42px;
    border-radius:14px;
    font-size:22px;
    background:#101a31;
}

.clear-history{
    margin:14px;
    height:48px;
    border-radius:16px;
    background:#101a31;
    font-size:15px;
}

.history-list{
    flex:1;
    overflow-y:auto;
    padding:0 14px 20px;
}

.history-item{
    background:#0d162b;
    border-radius:17px;
    padding:14px;
    margin-bottom:10px;
}

.history-expression{
    color:#8994a8;
    font-size:14px;
    margin-bottom:7px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.history-result{
    font-size:22px;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.empty-history{
    text-align:center;
    color:#707b90;
    margin-top:80px;
    font-size:15px;
}

/* SMALL SCREENS */

@media(max-height:650px){
    .header{
        height:54px;
        min-height:54px;
    }

    .display{
        min-height:120px;
        padding-top:10px;
    }

    .current{
        font-size:40px;
    }

    .buttons{
        grid-auto-rows:minmax(52px,1fr);
        gap:7px;
        padding:8px;
    }

    button{
        border-radius:16px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div>
            <div class="logo">KJ Calculator</div>
            <div class="version">Simple • Fast • Accurate • v2.0</div>
        </div>

        <button class="history-btn" onclick="openHistory()">☷</button>
    </div>

    <!-- DISPLAY -->
    <div class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">

        <button class="special" onclick="clearAll()">AC</button>
        <button class="special" onclick="backspace()">⌫</button>
        <button class="special" onclick="percent()">%</button>
        <button class="operator" onclick="chooseOperator('÷')">÷</button>

        <button class="number" onclick="inputNumber('7')">7</button>
        <button class="number" onclick="inputNumber('8')">8</button>
        <button class="number" onclick="inputNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('×')">×</button>

        <button class="number" onclick="inputNumber('4')">4</button>
        <button class="number" onclick="inputNumber('5')">5</button>
        <button class="number" onclick="inputNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('−')">−</button>

        <button class="number" onclick="inputNumber('1')">1</button>
        <button class="number" onclick="inputNumber('2')">2</button>
        <button class="number" onclick="inputNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="special" onclick="toggleSign()">±</button>
        <button class="number zero" onclick="inputNumber('0')">0</button>
        <button class="number" onclick="inputDecimal()">.</button>

        <button class="equals" onclick="calculate()">=</button>

    </div>

    <!-- HISTORY -->
    <div class="history-panel" id="historyPanel">

        <div class="history-header">
            <div class="history-title">History</div>
            <button class="close-history" onclick="closeHistory()">×</button>
        </div>

        <button class="clear-history" onclick="clearHistory()">
            Clear History
        </button>

        <div class="history-list" id="historyList"></div>

    </div>

</div>

<script>
let current = "0";
let previous = "";
let operator = null;
let waitingForNumber = false;

const currentDisplay = document.getElementById("current");
const previousDisplay = document.getElementById("previous");

function updateDisplay(){
    currentDisplay.textContent = current;
    previousDisplay.textContent =
        operator && previous !== ""
        ? previous + " " + operator
        : "";
}

function inputNumber(number){

    if(waitingForNumber){
        current = number;
        waitingForNumber = false;
    }else{
        if(current === "0"){
            current = number;
        }else{
            current += number;
        }
    }

    updateDisplay();
}

function inputDecimal(){

    if(waitingForNumber){
        current = "0.";
        waitingForNumber = false;
        updateDisplay();
        return;
    }

    if(!current.includes(".")){
        current += ".";
    }

    updateDisplay();
}

function chooseOperator(newOperator){

    if(operator && waitingForNumber){
        operator = newOperator;
        updateDisplay();
        return;
    }

    if(operator && previous !== ""){
        calculate(false);
    }

    previous = current;
    operator = newOperator;
    waitingForNumber = true;

    updateDisplay();
}

function calculate(saveHistory = true){

    if(!operator || previous === ""){
        return;
    }

    const a = parseFloat(previous);
    const b = parseFloat(current);

    let result;

    if(operator === "+"){
        result = a + b;
    }

    if(operator === "−"){
        result = a - b;
    }

    if(operator === "×"){
        result = a * b;
    }

    if(operator === "÷"){
        if(b === 0){
            current = "Error";
            previous = "";
            operator = null;
            waitingForNumber = true;
            updateDisplay();
            return;
        }

        result = a / b;
    }

    result = formatNumber(result);

    if(saveHistory){
        addHistory(
            previous + " " + operator + " " + current,
            result
        );
    }

    current = result;
    previous = "";
    operator = null;
    waitingForNumber = true;

    updateDisplay();
}

function formatNumber(number){

    if(!Number.isFinite(number)){
        return "Error";
    }

    const rounded =
        Math.round((number + Number.EPSILON) * 100000000) / 100000000;

    return String(rounded);
}

function clearAll(){

    current = "0";
    previous = "";
    operator = null;
    waitingForNumber = false;

    updateDisplay();
}

function backspace(){

    if(waitingForNumber){
        return;
    }

    if(current.length <= 1){
        current = "0";
    }else{
        current = current.slice(0,-1);
    }

    updateDisplay();
}

function toggleSign(){

    if(current === "0" || current === "Error"){
        return;
    }

    current =
        current.startsWith("-")
        ? current.slice(1)
        : "-" + current;

    updateDisplay();
}

function percent(){

    if(current === "Error"){
        return;
    }

    current = formatNumber(parseFloat(current) / 100);

    updateDisplay();
}

/* HISTORY */

function getHistory(){

    try{
        return JSON.parse(
            localStorage.getItem("kjCalculatorHistory") || "[]"
        );
    }catch(e){
        return [];
    }
}

function saveHistory(history){

    try{
        localStorage.setItem(
            "kjCalculatorHistory",
            JSON.stringify(history)
        );
    }catch(e){
        // Storage unavailable — calculator still works.
    }
}

function addHistory(expression,result){

    const history = getHistory();

    history.unshift({
        expression:expression,
        result:result,
        time:Date.now()
    });

    if(history.length > 50){
        history.length = 50;
    }

    saveHistory(history);
}

function renderHistory(){

    const list = document.getElementById("historyList");
    const history = getHistory();

    list.innerHTML = "";

    if(history.length === 0){

        list.innerHTML =
            '<div class="empty-history">No calculations yet</div>';

        return;
    }

    history.forEach((item,index)=>{

        const div = document.createElement("div");

        div.className = "history-item";

        div.innerHTML = `
            <div class="history-expression">
                ${escapeHTML(item.expression)}
            </div>

            <div class="history-result">
                = ${escapeHTML(item.result)}
            </div>
        `;

        div.onclick = function(){

            current = String(item.result);
            previous = "";
            operator = null;
            waitingForNumber = true;

            updateDisplay();
            closeHistory();
        };

        list.appendChild(div);
    });
}

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function openHistory(){

    renderHistory();

    document
        .getElementById("historyPanel")
        .classList.add("open");
}

function closeHistory(){

    document
        .getElementById("historyPanel")
        .classList.remove("open");
}

function clearHistory(){

    if(confirm("Clear all calculator history?")){

        try{
            localStorage.removeItem("kjCalculatorHistory");
        }catch(e){}

        renderHistory();
    }
}

/* KEYBOARD SUPPORT */

document.addEventListener("keydown",function(event){

    const key = event.key;

    if(key >= "0" && key <= "9"){
        inputNumber(key);
        return;
    }

    if(key === "."){
        inputDecimal();
        return;
    }

    if(key === "+"){
        chooseOperator("+");
        return;
    }

    if(key === "-"){
        chooseOperator("−");
        return;
    }

    if(key === "*"){
        chooseOperator("×");
        return;
    }

    if(key === "/"){
        event.preventDefault();
        chooseOperator("÷");
        return;
    }

    if(key === "%"){
        percent();
        return;
    }

    if(key === "Enter" || key === "="){
        calculate();
        return;
    }

    if(key === "Backspace"){
        backspace();
        return;
    }

    if(key === "Escape"){
        clearAll();
        return;
    }
});

/* START */

updateDisplay();
</script>

</body>
  </html>
