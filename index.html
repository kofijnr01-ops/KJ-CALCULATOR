<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>KJ Calculator v1.4</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#050816;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  padding:16px;
  display:flex;
  flex-direction:column;
}

.header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.menu{
  width:52px;
  height:52px;
  border-radius:17px;
  background:#0d1732;
  border:1px solid #293b69;
  color:#fff;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:4px;
}

.version{
  color:#7180a5;
  font-size:12px;
  letter-spacing:2px;
}

.display{
  height:170px;
  margin-top:8px;
  padding:20px;
  border-radius:30px;
  background:linear-gradient(145deg,#111a38,#080e22);
  border:1px solid #293b69;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.04),
    0 15px 35px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.smallDisplay{
  width:100%;
  min-height:22px;
  color:#66769a;
  text-align:right;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
}

#display{
  width:100%;
  text-align:right;
  font-size:52px;
  font-weight:300;
  white-space:nowrap;
  overflow:hidden;
}

.buttons{
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:10px;
  margin-top:14px;
}

button{
  border:1px solid #1d2c52;
  border-radius:21px;
  color:#fff;
  font-size:24px;
  font-weight:bold;
  transition:.1s;
}

button:active{
  transform:scale(.92);
  filter:brightness(1.25);
}

.number{
  background:linear-gradient(145deg,#111d3c,#0d1730);
}

.operator{
  background:linear-gradient(145deg,#1c315f,#14274d);
  border-color:#304778;
}

.clear{
  background:linear-gradient(145deg,#702c50,#501f3b);
  border-color:#8b3760;
}

.equals{
  background:linear-gradient(145deg,#4772ff,#2855ef);
  border-color:#6283ff;
  box-shadow:0 8px 25px rgba(45,88,255,.3);
}

.zero{
  grid-column:span 2;
}

/* HISTORY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  z-index:10;
}

.overlay.show{
  display:block;
}

.history{
  position:fixed;
  top:0;
  left:-100%;
  width:88%;
  max-width:390px;
  height:100vh;
  padding:24px 20px;
  background:#080e21;
  border-right:1px solid #293b69;
  z-index:20;
  transition:left .25s ease;
  box-shadow:15px 0 45px rgba(0,0,0,.4);
}

.history.open{
  left:0;
}

.historyHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.historyTitle{
  font-size:27px;
  font-weight:800;
}

.close{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#111d3b;
  border:1px solid #293b69;
  color:white;
  font-size:25px;
}

.clearHistory{
  width:100%;
  height:48px;
  border-radius:15px;
  background:#54213f;
  border:1px solid #783057;
  color:#fff;
  font-size:15px;
  margin-bottom:15px;
}

.historyList{
  height:calc(100% - 130px);
  overflow-y:auto;
}

.historyItem{
  padding:17px 5px;
  border-bottom:1px solid #1b2949;
  font-size:18px;
  color:#e4e9f5;
}

.empty{
  text-align:center;
  color:#687799;
  margin-top:45px;
  font-size:15px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(80px);
  background:#17254a;
  border:1px solid #304778;
  padding:12px 20px;
  border-radius:14px;
  font-size:14px;
  opacity:0;
  transition:.25s;
  z-index:50;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="menu" onclick="openHistory()">☰</button>

    <div class="logo">KJ</div>

    <div class="version">v1.4</div>

  </div>

  <div class="display">

    <div class="smallDisplay" id="smallDisplay"></div>

    <div id="display">0</div>

  </div>

  <div class="buttons">

    <button class="clear" onclick="clearDisplay()">AC</button>
    <button class="number" onclick="deleteNumber()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="add('/')">÷</button>

    <button class="number" onclick="add('7')">7</button>
    <button class="number" onclick="add('8')">8</button>
    <button class="number" onclick="add('9')">9</button>
    <button class="operator" onclick="add('*')">×</button>

    <button class="number" onclick="add('4')">4</button>
    <button class="number" onclick="add('5')">5</button>
    <button class="number" onclick="add('6')">6</button>
    <button class="operator" onclick="add('-')">−</button>

    <button class="number" onclick="add('1')">1</button>
    <button class="number" onclick="add('2')">2</button>
    <button class="number" onclick="add('3')">3</button>
    <button class="operator" onclick="add('+')">+</button>

    <button class="number zero" onclick="add('0')">0</button>
    <button class="number" onclick="add('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>

</div>

<div class="overlay" id="overlay" onclick="closeHistory()"></div>

<div class="history" id="history">

  <div class="historyHead">

    <div class="historyTitle">History</div>

    <button class="close" onclick="closeHistory()">×</button>

  </div>

  <button class="clearHistory" onclick="clearHistory()">
    Clear History
  </button>

  <div class="historyList" id="historyList"></div>

</div>

<div class="toast" id="toast">Copied</div>

<script>

let expression = "";

let display = document.getElementById("display");
let smallDisplay = document.getElementById("smallDisplay");

let history =
JSON.parse(localStorage.getItem("kjHistory") || "[]");

function render(){

  display.innerText =
    expression === ""
    ? "0"
    : expression
      .replace(/\*/g,"×")
      .replace(/\//g,"÷")
      .replace(/-/g,"−");

}

function add(value){

  if(
    ["+","-","*","/"].includes(value) &&
    expression !== "" &&
    ["+","-","*","/"].includes(expression.slice(-1))
  ){
    expression =
      expression.slice(0,-1) + value;
  }else{

    if(value === "." ){

      let parts =
        expression.split(/[+\-*/]/);

      if(parts[parts.length-1].includes(".")){
        return;
      }

    }

    expression += value;
  }

  render();
}

function percent(){

  if(expression === "") return;

  let match =
    expression.match(/(\d+\.?\d*)$/);

  if(!match) return;

  let number =
    parseFloat(match[1]);

  let result =
    number / 100;

  expression =
    expression.slice(0,-match[1].length) +
    result;

  render();
}

function clearDisplay(){

  expression = "";

  display.innerText = "0";
  smallDisplay.innerText = "";

}

function deleteNumber(){

  expression =
    expression.slice(0,-1);

  render();

}

function calculate(){

  if(expression === "") return;

  try{

    let original = expression;

    let answer =
      Function(
        '"use strict";return (' +
        expression +
        ')'
      )();

    if(!Number.isFinite(answer)){
      throw new Error();
    }

    answer =
      Number.isInteger(answer)
      ? answer
      : parseFloat(answer.toFixed(10));

    smallDisplay.innerText =
      original
      .replace(/\*/g,"×")
      .replace(/\//g,"÷")
      .replace(/-/g,"−");

    display.innerText = answer;

    expression = String(answer);

    history.unshift(
      original + " = " + answer
    );

    if(history.length > 50){
      history.pop();
    }

    localStorage.setItem(
      "kjHistory",
      JSON.stringify(history)
    );

    showHistory();

  }catch(e){

    display.innerText = "Error";
    expression = "";

  }

}

function openHistory(){

  document
  .getElementById("history")
  .classList.add("open");

  document
  .getElementById("overlay")
  .classList.add("show");

  showHistory();

}

function closeHistory(){

  document
  .getElementById("history")
  .classList.remove("open");

  document
  .getElementById("overlay")
  .classList.remove("show");

}

function showHistory(){

  let list =
    document.getElementById("historyList");

  if(history.length === 0){

    list.innerHTML =
      '<div class="empty">No calculations yet</div>';

    return;

  }

  list.innerHTML =
    history.map(function(item){

      return `
        <div class="historyItem"
             onclick="useHistory('${item.replace(/'/g,"\\'")}')">
          ${item
            .replace(/\*/g,"×")
            .replace(/\//g,"÷")
            .replace(/-/g,"−")}
        </div>
      `;

    }).join("");

}

function useHistory(item){

  let result =
    item.split(" = ")[1];

  expression = result;

  render();

  closeHistory();

}

function clearHistory(){

  history = [];

  localStorage.removeItem("kjHistory");

  showHistory();

}

showHistory();

</script>

</body>
</html>
