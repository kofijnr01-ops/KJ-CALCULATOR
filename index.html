<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>KJ Calculator v1.3</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#050816;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  padding:16px;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.historyBtn{
  width:48px;
  height:48px;
  border:1px solid #253762;
  border-radius:16px;
  background:#0c1530;
  color:#fff;
  font-size:24px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:3px;
}

.version{
  font-size:11px;
  color:#7180a5;
  letter-spacing:1px;
}

/* DISPLAY */
.display{
  width:100%;
  height:175px;
  margin-top:8px;
  padding:22px;
  border-radius:30px;
  background:linear-gradient(145deg,#101a38,#080e22);
  border:1px solid #263866;
  box-shadow:
    0 15px 40px rgba(0,0,0,.28),
    inset 0 1px 1px rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.smallDisplay{
  width:100%;
  min-height:24px;
  text-align:right;
  color:#68789e;
  font-size:16px;
  overflow:hidden;
  white-space:nowrap;
}

#display{
  width:100%;
  text-align:right;
  font-size:50px;
  font-weight:300;
  white-space:nowrap;
  overflow:hidden;
}

/* BUTTONS */
.buttons{
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:10px;
  margin-top:14px;
}

button{
  border:1px solid transparent;
  border-radius:21px;
  color:white;
  font-size:24px;
  font-weight:bold;
  transition:transform .08s,filter .08s;
}

button:active{
  transform:scale(.93);
  filter:brightness(1.25);
}

.number{
  background:linear-gradient(145deg,#111c3b,#0d1730);
  border-color:#1b2a50;
}

.operator{
  background:linear-gradient(145deg,#1b2d5b,#152449);
  border-color:#2a4074;
}

.clear{
  background:linear-gradient(145deg,#642847,#4b1d37);
  border-color:#793253;
}

.equals{
  background:linear-gradient(145deg,#4770ff,#2854ec);
  border-color:#6384ff;
  box-shadow:0 8px 24px rgba(49,92,255,.28);
}

.zero{
  grid-column:span 2;
}

/* HISTORY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:10;
  display:none;
}

.overlay.show{
  display:block;
}

.historyPanel{
  position:fixed;
  top:0;
  left:-100%;
  width:88%;
  max-width:380px;
  height:100vh;
  padding:24px 20px;
  background:#080e21;
  border-right:1px solid #263866;
  z-index:20;
  transition:left .25s ease;
  box-shadow:15px 0 40px rgba(0,0,0,.35);
}

.historyPanel.open{
  left:0;
}

.historyTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.historyTitle{
  font-size:26px;
  font-weight:800;
}

.closeBtn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#111c38;
  border:1px solid #24355d;
  color:#fff;
  font-size:25px;
}

.clearHistory{
  width:100%;
  height:48px;
  border:0;
  border-radius:15px;
  background:#54203d;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  margin-bottom:15px;
}

.historyList{
  height:calc(100% - 130px);
  overflow-y:auto;
}

.historyItem{
  padding:16px 7px;
  border-bottom:1px solid #1c2949;
  color:#dce4f5;
  font-size:18px;
}

.empty{
  color:#667696;
  text-align:center;
  margin-top:40px;
  font-size:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="historyBtn" onclick="openHistory()">☰</button>

    <div class="logo">KJ</div>

    <div class="version">v1.3</div>
  </div>

  <div class="display">
    <div class="smallDisplay" id="smallDisplay"></div>
    <div id="display">0</div>
  </div>

  <div class="buttons">

    <button class="clear" onclick="clearDisplay()">AC</button>
    <button class="number" onclick="deleteNumber()">⌫</button>
    <button class="operator" onclick="add('%')">%</button>
    <button class="operator" onclick="add('/')">÷</button>

    <button class="number" onclick="add('7')">7</button>
    <button class="number" onclick="add('8')">8</button>
    <button class="number" onclick="add('9')">9</button>
    <button class="operator" onclick="add('*')">×</button>

    <button class="number" onclick="add('4')">4</button>
    <button class="number" onclick="add('5')">5</button>
    <button class="number" onclick="add('6')">6</button>
    <button class="operator" onclick="add('-')">−</button>

    <button class="number" onclick="add('1')">1</button>
    <button class="number" onclick="add('2')">2</button>
    <button class="number" onclick="add('3')">3</button>
    <button class="operator" onclick="add('+')">+</button>

    <button class="number zero" onclick="add('0')">0</button>
    <button class="number" onclick="add('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>

</div>

<div class="overlay" id="overlay" onclick="closeHistory()"></div>

<div class="historyPanel" id="historyPanel">

  <div class="historyTop">
    <div class="historyTitle">History</div>
    <button class="closeBtn" onclick="closeHistory()">×</button>
  </div>

  <button class="clearHistory" onclick="clearHistory()">
    Clear History
  </button>

  <div class="historyList" id="historyList"></div>

</div>

<script>

let display = document.getElementById("display");
let smallDisplay = document.getElementById("smallDisplay");

let expression = "";

let history =
JSON.parse(localStorage.getItem("kjHistory") || "[]");

function add(value){

  if(value === "%"){
    expression += "/100";
  }else{
    expression += value;
  }

  display.innerText =
    expression
      .replace(/\*/g,"×")
      .replace(/\//g,"÷")
      .replace(/-/g,"−");

}

function clearDisplay(){

  expression = "";

  display.innerText = "0";
  smallDisplay.innerText = "";
}

function deleteNumber(){

  expression =
    expression.slice(0,-1);

  if(expression === ""){
    display.innerText = "0";
  }else{
    display.innerText =
      expression
        .replace(/\*/g,"×")
        .replace(/\//g,"÷")
        .replace(/-/g,"−");
  }
}

function calculate(){

  if(expression === "") return;

  try{

    let original = expression;

    let answer = Function(
      '"use strict"; return (' +
      expression +
      ')'
    )();

    if(!Number.isFinite(answer)){
      throw new Error();
    }

    answer = Number.isInteger(answer)
      ? answer
      : parseFloat(answer.toFixed(10));

    smallDisplay.innerText =
      original
        .replace(/\*/g,"×")
        .replace(/\//g,"÷")
        .replace(/-/g,"−");

    display.innerText = answer;

    expression = String(answer);

    history.unshift(
      original + " = " + answer
    );

    localStorage.setItem(
      "kjHistory",
      JSON.stringify(history)
    );

  }catch(error){

    smallDisplay.innerText = "";
    display.innerText = "Error";
    expression = "";

  }
}

function openHistory(){

  document
    .getElementById("historyPanel")
    .classList.add("open");

  document
    .getElementById("overlay")
    .classList.add("show");

  showHistory();
}

function closeHistory(){

  document
    .getElementById("historyPanel")
    .classList.remove("open");

  document
    .getElementById("overlay")
    .classList.remove("show");
}

function showHistory(){

  let list =
    document.getElementById("historyList");

  if(history.length === 0){

    list.innerHTML =
      '<div class="empty">No calculations yet.</div>';

    return;
  }

  list.innerHTML =
    history.map(function(item){

      return '<div class="historyItem">' +
        item
        .replace(/\*/g,"×")
        .replace(/\//g,"÷")
        .replace(/-/g,"−") +
        '</div>';

    }).join("");
}

function clearHistory(){

  history = [];

  localStorage.removeItem("kjHistory");

  showHistory();
}

showHistory();

</script>

</body>
</html>
