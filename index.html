<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a18">

<title>KJ Calculator v1.1</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #050a18;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.calculator {
  width: 100%;
  max-width: 390px;
  height: calc(100dvh - 24px);
  max-height: 850px;
  background: #0b1228;
  border: 2px solid #1d2948;
  border-radius: 30px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */

.header {
  position: relative;
  text-align: center;
  flex-shrink: 0;
}

.header h1 {
  margin: 4px 0 4px;
  font-size: 38px;
}

.header p {
  margin: 0;
  font-size: 20px;
}

.version {
  margin-top: 8px;
  color: #858da3;
  font-size: 16px;
}

/* HISTORY BUTTON */

.history-btn {
  position: absolute;
  left: 0;
  top: 0;
  width: 52px;
  height: 42px;
  border: none;
  border-radius: 14px;
  background: #263858;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.history-btn:active {
  transform: scale(.94);
}

/* DISPLAY */

.display-box {
  margin-top: 16px;
  height: 170px;
  min-height: 150px;
  background: #030814;
  border: 2px solid #1d2948;
  border-radius: 38px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  flex-shrink: 0;
}

#historyPreview {
  color: #69748d;
  font-size: 17px;
  text-align: right;
  min-height: 24px;
  overflow: hidden;
}

#display {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  text-align: right;
  font-size: 48px;
  font-weight: bold;
  margin-top: 4px;
}

.display-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  border: none;
  background: #263858;
  color: white;
  border-radius: 18px;
  padding: 10px 18px;
  font-size: 16px;
  font-weight: bold;
}
