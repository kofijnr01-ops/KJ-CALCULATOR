<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060b1d">
<title>KJ Calculator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#060b1d;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  padding:18px 30px 14px;
  position:relative;
}

/* TOP */
.top{
  height:86px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu{
  width:70px;
  height:70px;
  border-radius:25px;
  background:#101a38;
  border:1px solid #233968;
  color:white;
  font-size:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:42px;
  font-weight:800;
  letter-spacing:2px;
}

.version{
  color:#7180a9;
  font-size:18px;
}

/* DISPLAY */
.display{
  height:332px;
  margin-top:18px;
  margin-bottom:28px;
  padding:25px 28px;
  border-radius:38px;
  background:#0d1530;
  border:1px solid #243968;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.expression{
  width:100%;
  text-align:right;
  color:#7180a9;
  font-size:22px;
  min-height:30px;
  overflow:hidden;
  white-space:nowrap;
}

.result{
  width:100%;
  text-align:right;
  font-size:72px;
  font-weight:300;
  overflow:hidden;
  white-space:nowrap;
}

/* BUTTONS */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

button{
  border:0;
  color:white;
  background:#101a38;
  height:82px;
  border-radius:30px;
  font-size:30px;
  font-weight:700;
}

button:active{
  transform:scale(.94);
  filter:brightness(1.2);
}

.operator{
  background:#172650;
}

.clear{
  background:#652443;
}

.equals{
  background:#315df5;
}

.zero{
  grid-column:span 2;
}

/* HISTORY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  z-index:100;
}

.overlay.show{
  display:block;
}

.history{
  width:min(88%,390px);
  height:100%;
  background:#091127;
  border-right:1px solid #243968;
  padding:22px;
  overflow-y:auto;
}

.history-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.history-title{
  font-size:28px;
  font-weight:800;
}

.close{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#172342;
  font-size:28px;
}

.clear-history{
  width:100%;
  height:55px;
  margin-bottom:18px;
  border-radius:18px;
  background:#652443;
  font-size:18px;
}

.history-item{
  padding:17px;
  margin-bottom:12px;
  border-radius:20px;
  background:#101a38;
  border:1px solid #1e3158;
}

.history-expression{
  color:#7180a9;
  font-size:16px;
  margin-bottom:7px;
}

.history-result{
  font-size:25px;
  font-weight:700;
}

/* SMALL PHONE */
@media(max-height:800px){
  .app{
    padding-top:10px;
    padding-left:30px;
    padding-right:30px;
  }

  .top{
    height:72px;
  }

  .menu{
    width:62px;
    height:62px;
    font-size:34px;
  }

  .logo{
    font-size:36px;
  }

  .display{
    height:300px;
    margin-top:12px;
    margin-bottom:18px;
  }

  .buttons{
    gap:12px;
  }

  button{
    height:76px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button class="menu" onclick="openHistory()">☰</button>

    <div class="logo">KJ</div>

    <div class="version">v1.5</div>

  </div>


  <div class="display">

    <div class="expression" id="expression"></div>

    <div class="result" id="result">0</div>

  </div>


  <div class="buttons">

    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="setOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="setOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="setOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="setOperator('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equals" onclick="calculate()">=</button>

  </div>

</div>


<!-- HISTORY -->

<div class="overlay" id="overlay">

  <div class="history">

    <div class="history-top">

      <div class="history-title">History</div>

      <button class="close" onclick="closeHistory()">×</button>

    </div>

    <button class="clear-history" onclick="clearHistory()">
      Clear History
    </button>

    <div id="historyList"></div>

  </div>

</div>


<script>

let current = "0";
let firstNumber = null;
let operator = null;
let waiting = false;

let history =
JSON.parse(localStorage.getItem("kj_history") || "[]");


const result = document.getElementById("result");
const expression = document.getElementById("expression");


function update(){

  result.textContent = current;

}


function number(n){

  if(current === "Error"){
    current = "0";
  }

  if(waiting){

    current = n;
    waiting = false;

  }else{

    if(current === "0"){
      current = n;
    }else{
      current += n;
    }

  }

  update();

}


function decimal(){

  if(waiting){

    current = "0.";
    waiting = false;

  }else if(!current.includes(".")){

    current += ".";

  }

  update();

}


function setOperator(op){

  if(current === "Error") return;

  if(operator !== null && !waiting){
    calculate(false);
  }

  firstNumber = parseFloat(current);

  operator = op;

  waiting = true;

  expression.textContent =
    firstNumber + " " + showOperator(op);

}


function calculate(save=true){

  if(operator === null || firstNumber === null){
    return;
  }

  let secondNumber = parseFloat(current);

  let answer;

  if(operator === "+"){
    answer = firstNumber + secondNumber;
  }

  if(operator === "-"){
    answer = firstNumber - secondNumber;
  }

  if(operator === "*"){
    answer = firstNumber * secondNumber;
  }

  if(operator === "/"){

    if(secondNumber === 0){

      current = "Error";

      firstNumber = null;
      operator = null;
      waiting = true;

      update();

      return;
    }

    answer = firstNumber / secondNumber;

  }


  answer = format(answer);


  let fullExpression =
    firstNumber + " " +
    showOperator(operator) + " " +
    secondNumber;


  current = answer;

  expression.textContent = fullExpression;


  if(save){

    addHistory(
      fullExpression,
      answer
    );

  }


  firstNumber = null;
  operator = null;
  waiting = true;

  update();

}


function format(num){

  if(!Number.isFinite(num)){
    return "Error";
  }

  return String(
    parseFloat(num.toFixed(10))
  );

}


function showOperator(op){

  if(op === "*") return "×";
  if(op === "/") return "÷";
  if(op === "-") return "−";

  return op;

}


function percent(){

  let value = parseFloat(current);

  if(isNaN(value)) return;

  current = format(value / 100);

  update();

}


function backspace(){

  if(waiting) return;

  if(current.length <= 1){

    current = "0";

  }else{

    current =
      current.slice(0,-1);

  }

  update();

}


function clearAll(){

  current = "0";
  firstNumber = null;
  operator = null;
  waiting = false;

  expression.textContent = "";

  update();

}


/* HISTORY */

function addHistory(exp,res){

  history.unshift({
    expression:exp,
    result:res
  });

  if(history.length > 50){
    history.pop();
  }

  localStorage.setItem(
    "kj_history",
    JSON.stringify(history)
  );

}


function openHistory(){

  renderHistory();

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeHistory(){

  document
    .getElementById("overlay")
    .classList.remove("show");

}


function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  if(history.length === 0){

    list.innerHTML =
      '<div style="text-align:center;color:#7180a9;padding:30px 0;">No calculations yet</div>';

    return;

  }


  history.forEach((item,index)=>{

    const div =
      document.createElement("div");

    div.className = "history-item";

    div.innerHTML =

      '<div class="history-expression">' +
      item.expression +
      '</div>' +

      '<div class="history-result">= ' +
      item.result +
      '</div>';


    div.onclick = function(){

      current = item.result;

      firstNumber = null;
      operator = null;
      waiting = true;

      expression.textContent =
        item.expression;

      update();

      closeHistory();

    };


    list.appendChild(div);

  });

}


function clearHistory(){

  history = [];

  localStorage.removeItem("kj_history");

  renderHistory();

}


document
.getElementById("overlay")
.addEventListener("click",function(e){

  if(e.target === this){
    closeHistory();
  }

});


update();

</script>

</body>
</html>
